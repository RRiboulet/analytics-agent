services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist_admin
      POSTGRES_PASSWORD: olist_admin
    ports:
      - "5432:5432"
    volumes:
      - olist-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/olist:/olist-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_admin -d olist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olist-postgres:
