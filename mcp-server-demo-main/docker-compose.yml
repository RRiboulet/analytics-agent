services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: factory
      POSTGRES_USER: factory_admin
      POSTGRES_PASSWORD: factory_admin
    ports:
      - "5432:5432"
    volumes:
      - factory-postgres:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./data/olist:/olist-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_admin -d factory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factory-postgres:
