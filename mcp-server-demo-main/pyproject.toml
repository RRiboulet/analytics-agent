[project]
name = "factory-mcp-demo"
version = "0.1.0"
description = "A production-oriented local MCP server for sample factory data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.27.2,<2.0.0",
    "asyncpg>=0.30.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.0",
    "sqlparse>=0.5.0",
]

[project.scripts]
factory-mcp-server = "app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
lint.select = ["E", "F", "I", "UP"]
