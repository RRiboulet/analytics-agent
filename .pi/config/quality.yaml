# Project quality configuration for the reusable coding skills.
# Path declared in AGENTS.md (host integration). Commands are run from
# analytics-agent/ (the project home) unless declared otherwise.
#
# working_directory is resolved relative to the repository root, so "."
# means the repository root and "analytics-agent" means analytics-agent/.
schema: "reusable-coding-quality"
version: 1

# Repository instruction files, in project-defined precedence order.
project_instructions_paths:
  - "../AGENTS.md"

paths:
  # Files or directories that must not be changed without explicit authorization.
  protected:
    - "db/init/"
  # Generated or vendored content. Changes require the configured project process.
  generated:
    - "uv.lock"

commands:
  setup:
    - name: "sync-deps"
      command: "uv sync"
      working_directory: "analytics-agent"
      timeout_seconds: 600
      required: true
    # Node dependency shim for the pi extension tests. Links the globally
    # installed pi packages into node_modules; idempotent, no network access.
    # working_directory "." is the repository root (see the note at the top).
    - name: "extension-test-deps"
      command: ".pi/extensions/subagent/test/setup-deps.sh"
      working_directory: "."
      timeout_seconds: 120
      required: false

  format_check:
    - name: "ruff-format-check"
      command: "uv run ruff format --check ."
      working_directory: "analytics-agent"
      timeout_seconds: 300
      required: true

  lint:
    - name: "ruff-lint"
      command: "uv run ruff check ."
      working_directory: "analytics-agent"
      timeout_seconds: 300
      required: true

  focused_test:
    - name: "pytest-focused"
      command: "uv run pytest"
      working_directory: "analytics-agent"
      timeout_seconds: 600
      required: false

  full_test:
    - name: "pytest-full"
      command: "uv run pytest"
      working_directory: "analytics-agent"
      timeout_seconds: 1800
      required: true

  coverage:
    - name: "pytest-coverage"
      command: "uv run pytest --cov=app --cov-report=term-missing"
      working_directory: "analytics-agent"
      timeout_seconds: 1800
      required: true
    # TypeScript coverage for the vendored pi subagent extension, measured with
    # node's built-in coverage reporter. Not yet a required check: coverage of
    # index.ts is far from the 100% target below, so making it required now
    # would fail the gate for reasons unrelated to any change under review.
    - name: "extension-coverage"
      command: "node --test --experimental-test-coverage .pi/extensions/subagent/test/*.test.ts"
      working_directory: "."
      timeout_seconds: 600
      required: false

  extension_test:
    - name: "extension-tests"
      command: "node --test .pi/extensions/subagent/test/*.test.ts"
      working_directory: "."
      timeout_seconds: 600
      required: false

  final_gate:
    - name: "final-gate"
      command: "uv run ruff format --check . && uv run ruff check . && uv run pytest"
      working_directory: "analytics-agent"
      timeout_seconds: 2400
      required: true

coverage:
  # Measure new or changed executable code.
  scope: "changed_code"
  line: 100
  branch: 100
  exclusions: []

policies:
  no_threshold_reduction: true
  no_test_weakening: true
  no_silent_suppressions: true
  no_unrelated_changes: true
  fail_on_required_check_failure: true

report:
  statuses:
    - "passed"
    - "failed"
    - "not_run"
    - "unavailable"
