services:
  devcontainer:
    build:
      # The compose file lives in .devcontainer/, so context: . resolves to
      # the .devcontainer/ directory (where the Dockerfile and .dockerignore
      # live). This keeps the build context — and its .dockerignore —
      # co-located with the Dockerfile.
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - pi-config:/home/vscode/.pi
    command: sleep infinity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: vscode

volumes:
  pi-config: